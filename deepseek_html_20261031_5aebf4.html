<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 Đêm Hội Kẹo Ngọt - Học Tiếng Trung</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=ZCOOL+KuaiLe&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    width: 100vw; height: 100vh;
    background: linear-gradient(135deg, #1a0b2e 0%, #3b125c 50%, #1a0b2e 100%);
    font-family: 'Comic Neue', 'Comic Sans MS', cursive;
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    color: white;
  }

  /* Nền trang trí (Dơi bay, Sao lấp lánh) */
  .bg-decor {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: 
      radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
      radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px);
    background-size: 550px 550px, 350px 350px;
    background-position: 0 0, 40px 60px;
    opacity: 0.3;
  }
  .bat {
    position: absolute; font-size: 2.5em; animation: fly 15s linear infinite;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
  }
  @keyframes fly {
    0% { transform: translate(-100px, 0) scale(1); }
    50% { transform: translate(50vw, 50px) scale(1.2); }
    100% { transform: translate(110vw, -20px) scale(1); }
  }

  /* Khung Game Chính */
  .game-container {
    position: relative;
    width: 95%; max-width: 1200px;
    height: 90vh;
    background: rgba(30, 10, 60, 0.85);
    border: 8px solid #9d4edd;
    border-radius: 40px;
    box-shadow: 0 0 50px rgba(157, 78, 221, 0.6), inset 0 0 30px rgba(0,0,0,0.8);
    z-index: 10;
    display: flex; flex-direction: column;
    padding: 20px 40px;
    overflow: hidden;
  }

  /* Header (Điểm & Tiến độ) */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 1.8em; color: #ffd93d; font-weight: bold;
    text-shadow: 2px 2px 0 #d48806;
  }
  .candy-score {
    background: rgba(255,255,255,0.1);
    padding: 10px 30px; border-radius: 50px;
    border: 3px solid #ffd93d;
  }

  /* Khu vực câu hỏi */
  .question-area {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 15px;
  }

  .emoji-display {
    font-size: 15vh;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
    animation: bounce 2s infinite ease-in-out;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  .vietnamese-hint {
    background: #fff;
    color: #3b125c;
    font-size: 2em; font-weight: bold;
    padding: 10px 50px; border-radius: 50px;
    border: 5px solid #ff7e00;
    box-shadow: 0 8px 0 #b35900;
  }

  .listen-btn {
    margin-top: 10px;
    background: #39ff14; color: #1a0b2e;
    border: 4px solid white; border-radius: 30px;
    padding: 10px 40px; font-size: 1.5em; font-weight: bold;
    cursor: pointer; box-shadow: 0 6px 0 #1e8a06;
    transition: 0.1s; font-family: inherit;
  }
  .listen-btn:active { transform: translateY(6px); box-shadow: none; }

  /* Khu vực đáp án */
  .answers-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 20px; padding: 20px 0;
  }

  .answer-btn {
    background: #f3e8ff; color: #3b125c;
    border: 5px solid #9d4edd; border-radius: 25px;
    padding: 20px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 10px 0 #6a1b9a, 0 15px 20px rgba(0,0,0,0.4);
    font-family: 'ZCOOL KuaiLe', 'Comic Neue', sans-serif;
    position: relative;
  }
  .answer-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 0 #6a1b9a, 0 20px 25px rgba(0,0,0,0.4); }
  .answer-btn:active { transform: translateY(10px); box-shadow: 0 0px 0 #6a1b9a; }
  
  .answer-btn .num {
    position: absolute; top: -15px; left: -15px;
    background: #ff7e00; color: white; width: 45px; height: 45px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1.5em; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    font-family: 'Comic Neue';
  }

  .answer-btn .chinese { font-size: 3.5em; font-weight: bold; line-height: 1.2; }
  .answer-btn .pinyin { font-size: 1.2em; color: #7b1fa2; font-style: italic; margin-top: 5px; font-family: 'Comic Neue'; }

  /* Trạng thái Đúng / Sai */
  .answer-btn.correct {
    background: #a5d6a7; border-color: #4caf50;
    box-shadow: 0 0 30px #4caf50, 0 10px 0 #2e7d32;
    animation: pop 0.5s;
  }
  .answer-btn.wrong {
    background: #ffcdd2; border-color: #e53935;
    box-shadow: 0 10px 0 #b71c1c;
    animation: shake 0.5s;
  }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-15px); } 75% { transform: translateX(15px); } }

  /* Màn hình chờ / Kết thúc */
  .overlay {
    position: absolute; inset: 0; background: rgba(26, 11, 46, 0.95);
    z-index: 100; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    border-radius: 32px; transition: opacity 0.4s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay h1 {
    font-size: 5em; color: #ff7e00;
    text-shadow: 4px 4px 0 #fff, 0 0 30px #ff7e00;
    margin-bottom: 10px; font-family: 'ZCOOL KuaiLe', sans-serif;
  }
  .overlay p { font-size: 1.8em; margin-bottom: 30px; color: #e0b0ff; }

  .start-btn {
    background: #ff7e00; color: white; border: 6px solid #fff;
    padding: 20px 60px; font-size: 2.5em; font-weight: bold;
    border-radius: 50px; cursor: pointer;
    box-shadow: 0 10px 0 #b35900, 0 20px 40px rgba(0,0,0,0.5);
    font-family: inherit; animation: pulse 1.5s infinite;
    transition: 0.1s;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .start-btn:active { transform: translateY(10px); box-shadow: 0 0 0 #b35900; }

  /* Hiệu ứng bay lên */
  .float-text {
    position: absolute; font-size: 3em; font-weight: bold; pointer-events: none;
    animation: floatUp 1s ease-out forwards; z-index: 50;
  }
  @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }
</style>
</head>
<body>

<div class="bg-decor">
  <div class="bat" style="top: 10%; left: 0; animation-delay: 0s;">🦇</div>
  <div class="bat" style="top: 30%; left: 0; animation-delay: -5s; font-size: 1.5em;">🦇</div>
  <div class="bat" style="top: 60%; left: 0; animation-delay: -10s;">🦇</div>
</div>

<div class="game-container">
  <div class="header">
    <div class="candy-score">🍬 Kẹo: <span id="score">0</span></div>
    <div id="progress">Câu 1/10</div>
  </div>

  <div class="question-area">
    <div class="emoji-display" id="emojiQ">🎃</div>
    <div class="vietnamese-hint" id="vietQ">Bí ngô</div>
    <button class="listen-btn" id="listenBtn">🔊 Nghe cô đọc</button>
  </div>

  <div class="answers-grid" id="answersGrid">
    <!-- Các nút đáp án sẽ được tạo bằng JS -->
  </div>

  <!-- Màn hình Bắt đầu / Kết thúc -->
  <div class="overlay" id="startOverlay">
    <h1>万圣节快乐!</h1>
    <p>Chào mừng bé đến với Đêm Hội Kẹo Ngọt!</p>
    <p style="font-size: 1.3em; color: white;">Nhìn hình - Nghe âm thanh - Chọn chữ Hán đúng nhé!</p>
    <button class="start-btn" onclick="startGame()">🎃 BẮT ĐẦU CHƠI</button>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <h1>🎉 XUẤT SẮC! 🎉</h1>
    <div style="font-size: 6em; margin: 20px 0;" id="finalEmoji">🏆</div>
    <p>Bé đã nhận được <b><span id="finalScore">0</span> chiếc kẹo!</b></p>
    <button class="start-btn" onclick="startGame()">🔄 CHƠI LẠI NHÉ</button>
  </div>
</div>

<script>
// ==================== DỮ LIỆU TỪ VỰNG (Từ ảnh) ====================
const VOCAB = [
  { emoji: '🎃', viet: 'Bí ngô',      chinese: '南瓜',    pinyin: 'nánguā' },
  { emoji: '👻', viet: 'Con ma',      chinese: '鬼',      pinyin: 'guǐ' },
  { emoji: '🧙‍♀️', viet: 'Phù thủy',    chinese: '女巫',    pinyin: 'nǚwū' },
  { emoji: '🦇', viet: 'Con dơi',     chinese: '蝙蝠',    pinyin: 'biānfú' },
  { emoji: '🕷️', viet: 'Con nhện',    chinese: '蜘蛛',    pinyin: 'zhīzhū' },
  { emoji: '🍬', viet: 'Kẹo',         chinese: '糖果',    pinyin: 'tángguǒ' },
  { emoji: '🎭', viet: 'Mặt nạ',      chinese: '面具',    pinyin: 'miànjù' },
  { emoji: '🧛‍♂️', viet: 'Ma cà rồng',  chinese: '吸血鬼',  pinyin: 'xīxuèguǐ' },
  { emoji: '🏚️', viet: 'Nhà ma',      chinese: '鬼屋',    pinyin: 'guǐwū' },
  { emoji: '🧹', viet: 'Cái chổi',    chinese: '扫帚',    pinyin: 'sàozhou' }
];

// Trộn mảng
const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

// ==================== ÂM THANH ====================
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'correct') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}

// Phát âm tiếng Trung
function speakChinese(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.8; u.pitch = 1.2;
  window.speechSynthesis.speak(u);
}

// ==================== LOGIC GAME ====================
let currentQIndex = 0;
let score = 0;
let isAnswering = false;
let gameQuestions = [];

const els = {
  emoji: document.getElementById('emojiQ'),
  viet: document.getElementById('vietQ'),
  grid: document.getElementById('answersGrid'),
  score: document.getElementById('score'),
  progress: document.getElementById('progress'),
  startOverlay: document.getElementById('startOverlay'),
  endOverlay: document.getElementById('endOverlay')
};

function startGame() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  els.startOverlay.classList.add('hidden');
  els.endOverlay.classList.add('hidden');
  
  currentQIndex = 0;
  score = 0;
  els.score.innerText = '0';
  
  // Trộn 10 câu hỏi
  gameQuestions = shuffle(VOCAB);
  loadQuestion();
}

function loadQuestion() {
  if (currentQIndex >= gameQuestions.length) {
    endGame();
    return;
  }
  
  isAnswering = false;
  const q = gameQuestions[currentQIndex];
  els.progress.innerText = `Câu ${currentQIndex + 1}/${gameQuestions.length}`;
  
  // Hiển thị câu hỏi
  els.emoji.innerText = q.emoji;
  els.viet.innerText = q.viet;
  
  // Tự động đọc sau 0.5s
  setTimeout(() => speakChinese(q.chinese), 500);

  // Tạo 3 đáp án (1 đúng, 2 sai)
  const wrongs = shuffle(VOCAB.filter(v => v.chinese !== q.chinese)).slice(0, 2);
  const options = shuffle([q, ...wrongs]);
  
  els.grid.innerHTML = '';
  options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `
      <div class="num">${idx + 1}</div>
      <div class="chinese">${opt.chinese}</div>
      <div class="pinyin">${opt.pinyin}</div>
    `;
    btn.onclick = () => checkAnswer(btn, opt.chinese === q.chinese, q.chinese);
    els.grid.appendChild(btn);
  });
}

function checkAnswer(btn, isCorrect, correctChinese) {
  if (isAnswering) return;
  isAnswering = true;

  const allBtns = document.querySelectorAll('.answer-btn');
  allBtns.forEach(b => b.style.pointerEvents = 'none');

  if (isCorrect) {
    // ĐÚNG
    btn.classList.add('correct');
    score += 1;
    els.score.innerText = score;
    playSound('correct');
    speakChinese(correctChinese);
    showFloatText('+1 🍬', btn);

    setTimeout(() => {
      currentQIndex++;
      loadQuestion();
    }, 2000);
  } else {
    // SAI
    btn.classList.add('wrong');
    playSound('wrong');
    
    // Hiện đáp án đúng
    allBtns.forEach(b => {
      if (b.querySelector('.chinese').innerText === correctChinese) {
        b.classList.add('correct');
      }
    });

    setTimeout(() => {
      currentQIndex++;
      loadQuestion();
    }, 2500);
  }
}

function showFloatText(text, el) {
  const rect = el.getBoundingClientRect();
  const div = document.createElement('div');
  div.className = 'float-text';
  div.innerText = text;
  div.style.color = '#ffd93d';
  div.style.left = (rect.left + rect.width/2 - 30) + 'px';
  div.style.top = rect.top + 'px';
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 1000);
}

function endGame() {
  els.endOverlay.classList.remove('hidden');
  document.getElementById('finalScore').innerText = score;
  
  if (score >= 8) {
    document.getElementById('finalEmoji').innerText = '👑';
  } else if (score >= 5) {
    document.getElementById('finalEmoji').innerText = '🎃';
  } else {
    document.getElementById('finalEmoji').innerText = '👻';
  }
}

// Nút nghe lại
document.getElementById('listenBtn').onclick = () => {
  if (gameQuestions[currentQIndex]) {
    speakChinese(gameQuestions[currentQIndex].chinese);
  }
};

// Điều khiển bằng bàn phím (Dành cho cô giáo chiếu TV)
document.addEventListener('keydown', (e) => {
  if (!els.startOverlay.classList.contains('hidden')) {
    if (e.code === 'Space' || e.code === 'Enter') startGame();
    return;
  }
  if (!els.endOverlay.classList.contains('hidden')) return;

  if (e.code === 'Space') {
    e.preventDefault();
    document.getElementById('listenBtn').click();
  }
  
  if (['Digit1', 'Digit2', 'Digit3'].includes(e.code)) {
    const idx = parseInt(e.code.replace('Digit', '')) - 1;
    const btns = document.querySelectorAll('.answer-btn');
    if (btns[idx]) btns[idx].click();
  }
});
</script>
</body>
</html>
